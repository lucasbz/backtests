openapi: 3.0.3
info:
  title: backtests API
  description: >
    JSON HTTP API exposing the `backtest` and `info` CLI commands
    (see `internal/api/api.go`, started via `go run ./cmd serve -addr :8080`
    / `make serve`).


    This is the source of truth for the API contract used by the frontend.
    If anything here looks inconsistent with what the frontend was
    originally given, this document wins - treat any mismatch as a bug to
    raise, not something to route around.


    ## Conventions


    - All responses are `application/json`.
    - All monetary values (balances, profit, prices) are plain JSON numbers
      in BRL major units (e.g. `10000.00`, not cents, and not go-money's
      `{"amount":...,"currency":...}` object form).
    - Dates are `"YYYY-MM-DD"` strings throughout (requests and responses).
    - There is no authentication/authorization on any endpoint.
    - Errors, at any endpoint and for any failure, always have the shape
      documented in the `Error` schema below, with an appropriate HTTP
      status code:
      - `400` - invalid/missing input (bad JSON, missing required field,
        unparseable date/number, unknown strategy name, an invalid/missing
        `strategyParams` key for the chosen strategy, non-positive
        balance).
      - `404` - the request was well-formed but referred to something that
        doesn't exist (currently: an unimported/unknown asset on
        `GET /api/info`).
      - `500` - unexpected server-side failure.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local server (default `-addr :8080`)

paths:
  /api/info:
    get:
      operationId: getInfo
      summary: Look up the available imported date range for an asset.
      parameters:
        - name: asset
          in: query
          required: true
          description: >
            Ticker of the asset to look up, e.g. `PETR4`. Must match
            `^[A-Z0-9]+$` (uppercase letters and digits only) - this is
            enforced server-side to keep the value safe to use in a
            filesystem path lookup.
          schema:
            type: string
            pattern: "^[A-Z0-9]+$"
      responses:
        "200":
          description: The asset's imported date range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
              example:
                asset: PETR4
                earliest: "2010-01-04"
                latest: "2026-07-30"
        "400":
          description: >
            Missing/empty `asset` query param, or `asset` doesn't match
            `^[A-Z0-9]+$`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    error: asset is required
                invalidFormat:
                  value:
                    error: 'asset must match ^[A-Z0-9]+$ (uppercase letters and digits only), got "../../etc"'
        "404":
          description: The asset has no imported data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no data found for asset "NOPE9" (not imported yet?)
        "500":
          description: Unexpected server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/assets:
    get:
      operationId: listAssets
      summary: >
        List available assets (by ticker), optionally filtered to a
        specific year and, when filtered, sorted by that year's trading
        volume.
      parameters:
        - name: year
          in: query
          required: false
          description: >
            When present, only tickers that have imported data for this
            year are returned. Omit to list every ticker with any imported
            data.
          schema:
            type: integer
          example: 2015
      responses:
        "200":
          description: >
            Tickers split into two groups: `stocks` (common equities, i.e.
            ordinary/preferred share classes) and `others` (units, ETFs,
            BDRs, index-tracking tickers, etc). Both arrays are `[]` (not
            `null`) when nothing matches - there is no `404` case for this
            endpoint. Sort order within each array depends on `year`: with
            no `year` filter, tickers are sorted alphabetically (there's no
            single year's volume to rank them by); with a `year` filter,
            tickers are sorted by that year's total trading volume,
            descending (most-traded first, ties broken alphabetically).


            Classification comes from `resources/cotahist/assets.json` (see
            `scripts/import_cotahist.go`, which bootstraps and enriches
            it from COTAHIST data on import): a ticker lands in `stocks`
            when its registry entry's `type` is `"stock"`, and in `others`
            otherwise - including when the ticker has no registry entry at
            all (e.g. it was imported before assets.json existed and the
            importer hasn't been re-run since).


            Each entry's `volume` (that year's total trading volume, in
            major currency units - same convention as a candle's `volume`
            field, see `Candle`) is only present when the request includes
            `year`; it's omitted entirely (not `null`) on an unfiltered
            request, since volume is meaningless without a specific year to
            sum over.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetsResponse"
              examples:
                noYearFilter:
                  summary: No `year` filter - volume omitted
                  value:
                    stocks: [{ ticker: "ITUB4" }, { ticker: "PETR3" }, { ticker: "PETR4" }, { ticker: "VALE3" }]
                    others: [{ ticker: "BOVA11" }, { ticker: "IBOV11" }]
                yearFilter:
                  summary: "`year=2015` - sorted by descending volume, volume present"
                  value:
                    stocks: [{ ticker: "PETR4", volume: 45123456.78 }, { ticker: "VALE3", volume: 30111222.33 }, { ticker: "ITUB4", volume: 12000000.0 }]
                    others: [{ ticker: "BOVA11", volume: 987654.32 }]
        "400":
          description: The `year` query param was present but not a valid integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: year must be a valid integer
        "500":
          description: Unexpected server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/strategies:
    get:
      operationId: listStrategies
      summary: List the strategies accepted by `strategy` on `POST /api/backtest`.
      responses:
        "200":
          description: >
            A JSON array of strategy descriptors, sorted alphabetically by
            `name`. `params` describes the `strategyParams` keys that
            strategy expects (see `BacktestRequest.strategyParams` for the
            authoritative per-strategy prose) - `[]` for a strategy that
            takes none (e.g. `buy-and-hold`). This is a UI hint for
            rendering the right inputs, not the source of validation truth:
            the actual required-ness and cross-field rules (e.g.
            `shortPeriod` < `longPeriod`) are still enforced server-side by
            `POST /api/backtest` and surface as a normal `400` there.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyInfo"
              example:
                - name: buy-and-hold
                  params: []
                - name: ema-crossover
                  params:
                    - key: shortPeriod
                      label: Short period
                      default: 12
                      min: 1
                      step: 1
                    - key: longPeriod
                      label: Long period
                      default: 26
                      min: 2
                      step: 1
                - name: ema-trend-breakout
                  params:
                    - key: shortPeriod
                      label: Short period
                      default: 8
                      min: 1
                      step: 1
                    - key: longPeriod
                      label: Long period
                      default: 80
                      min: 2
                      step: 1
                - name: rsi-threshold
                  params:
                    - key: period
                      label: RSI period
                      default: 14
                      min: 2
                      step: 1
                    - key: oversold
                      label: Oversold threshold
                      default: 30
                      min: 0
                      max: 100
                      step: 1
                    - key: overbought
                      label: Overbought threshold
                      default: 70
                      min: 0
                      max: 100
                      step: 1
                - name: sma-crossover
                  params:
                    - key: shortPeriod
                      label: Short period
                      default: 10
                      min: 1
                      step: 1
                    - key: longPeriod
                      label: Long period
                      default: 30
                      min: 2
                      step: 1
                - name: two-candle-breakout
                  params: []
        "500":
          description: Unexpected server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/stop-losses:
    get:
      operationId: listStopLosses
      summary: List the type names accepted by `stopLoss.type` on `POST /api/backtest`.
      responses:
        "200":
          description: >
            A JSON array of stop-loss type name strings, sorted
            alphabetically.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["fixed-amount", "none", "percent", "total-fixed-amount"]
        "500":
          description: Unexpected server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/backtest:
    post:
      operationId: runBacktest
      summary: Run a backtest, equivalent to the `backtest` CLI command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestRequest"
            example:
              asset: PETR4
              start: "2015-01-02"
              end: "2015-12-30"
              strategy: buy-and-hold
              balance: "10000.00"
              stopLoss:
                type: percent
                value: 5
              verbose: true
      responses:
        "200":
          description: >
            The backtest result. `operations` is present only when the
            request's `verbose` was `true` - it is omitted entirely from the
            JSON (not `null`, not `[]`) when `verbose` is `false`/absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"
              example:
                strategyName: Buy & Hold
                startingBalance: 10000
                endingBalance: 7223.2
                profit: -2776.8
                profitPercentage: -27.768000000000004
                totalOperations: 1
                gains: 0
                losses: 1
                winRate: 0
                maxDrawdownPercentage: 27.768000000000004
                maxDrawdownAmount: 2776.8
                operations:
                  - date: "2015-01-02"
                    buyOrder:
                      date: "2015-01-02"
                      price: 9.36
                      quantity: 1068
                    sellOrder:
                      date: "2015-12-30"
                      price: 6.76
                      quantity: 1068
                    days: 362
        "400":
          description: >
            Invalid input. Possible messages include (not exhaustive):
            missing required field(s), an `asset` that doesn't match
            `^[A-Z0-9]+$`, malformed JSON body, unparseable `balance`,
            non-positive `balance`, unknown `strategy`, a `strategyParams`
            missing a key `strategy` requires or with an out-of-range value
            (e.g. `sma-crossover` without `longPeriod`, or `rsi-threshold`
            with `oversold` >= `overbought`), unparseable `start`/`end`, a
            `stopLoss` present without a `type`, an unknown `stopLoss.type`,
            or a `stopLoss.value` invalid for that type (e.g.
            zero/negative).


            Note: an unknown/not-yet-imported `asset` on
            `POST /api/backtest` does **not** currently produce a `404` the
            way `GET /api/info` does - it silently runs with zero quotes,
            producing a `200` result with `totalOperations: 0`, `gains: 0`,
            `losses: 0`, `operations` empty (or omitted), and `endingBalance`
            equal to `startingBalance`. This mirrors the CLI's existing behavior
            (`backtest` doesn't pre-check the asset via `info`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingFields:
                  value:
                    error: "asset, start, end, strategy and balance are all required"
                invalidAsset:
                  value:
                    error: 'asset must match ^[A-Z0-9]+$ (uppercase letters and digits only), got "../../etc"'
                invalidJSON:
                  value:
                    error: "invalid JSON body: ..."
                invalidBalance:
                  value:
                    error: "parsing balance: parsing money \"abc\": ..."
                zeroBalance:
                  value:
                    error: "balance must be greater than zero"
                unknownStrategy:
                  value:
                    error: "unknown strategy \"nope\", available: buy-and-hold"
                missingStrategyParam:
                  value:
                    error: "SMA Crossover: missing required \"longPeriod\" param"
                invalidStrategyParam:
                  value:
                    error: "rsi-threshold: oversold (70) must be less than overbought (30)"
                invalidDate:
                  value:
                    error: "parsing start: parsing time \"not-a-date\" as \"2006-01-02\": ..."
                missingStopLossType:
                  value:
                    error: "stopLoss.type is required when stopLoss is present"
                unknownStopLossType:
                  value:
                    error: "unknown stop-loss type \"nope\", available: fixed-amount, none, percent, total-fixed-amount"
                invalidStopLossValue:
                  value:
                    error: "percent stop-loss value must be greater than zero, got 0"
        "500":
          description: >
            Unexpected failure reading/computing over already-validated
            input (e.g. corrupt imported data on disk).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/scan:
    post:
      operationId: runScan
      summary: >
        Run a strategy against every available asset (optionally restricted
        to a year), compared against a Buy & Hold baseline for each -
        equivalent to the `scan` CLI command. Same request shape as
        `POST /api/backtest` minus `asset` (a scan runs every asset, not
        one) plus `year`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
            example:
              strategy: sma-crossover
              strategyParams: { shortPeriod: 10, longPeriod: 30 }
              stopLoss:
                type: percent
                value: 5
              start: "2015-01-01"
              end: "2015-12-30"
              balance: "10000.00"
              year: 2015
      responses:
        "200":
          description: >
            One entry per scanned asset (the asset universe from
            `cotahist.ListAssets(year)`, same as `GET /api/assets`), sorted
            with every successfully-scanned asset first (by `delta`
            descending - biggest winners first), then every asset whose
            backtest failed to load/run, last. This endpoint always returns
            `200` once the request itself is valid and the asset universe
            could be listed - an individual asset's backtest failing (e.g.
            corrupt imported data) does **not** fail the whole request, it
            just produces an error-only entry for that asset (see
            `ScanResult`). Deliberately lean: no per-operation `operations`
            arrays - drill into a specific asset via `POST /api/backtest` or
            the CLI's `compare` once a candidate is found here.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanResult"
              example:
                - asset: PETR4
                  baselineProfitPercentage: -27.77
                  challengerProfitPercentage: 12.34
                  challengerTotalOperations: 6
                  delta: 40.11
                  won: true
                - asset: VALE3
                  baselineProfitPercentage: 8.1
                  challengerProfitPercentage: 8.1
                  challengerTotalOperations: 0
                  delta: 0
                  won: false
                - asset: XPTO3
                  error: "loading candles for XPTO3: ..."
        "400":
          description: >
            Invalid input - the same up-front validation
            `POST /api/backtest` performs (minus anything `asset`-specific,
            since there is no single `asset` here): missing required
            field(s) (`start`, `end`, `strategy`, `balance`), malformed JSON
            body, unparseable/non-positive `balance`, unknown `strategy`, a
            `strategyParams` missing a key `strategy` requires or with an
            out-of-range value, unparseable `start`/`end`, a `stopLoss`
            present without a `type`, an unknown `stopLoss.type`, or an
            invalid `stopLoss.value`. See `POST /api/backtest`'s `400`
            examples for the exact message shapes - they're produced by the
            same validation code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingFields:
                  value:
                    error: "start, end, strategy and balance are all required"
                unknownStrategy:
                  value:
                    error: "unknown strategy \"nope\", available: buy-and-hold"
        "500":
          description: >
            Unexpected server-side failure listing the asset universe (e.g.
            `resources/cotahist` unreadable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/candles:
    get:
      operationId: getCandles
      summary: >
        Raw daily candles for an asset over an inclusive date range, for
        charting (e.g. a candlestick view). Runs no strategy and returns no
        derived result - just the underlying price/volume data, same shape
        `POST /api/backtest`'s internal candle-loading uses.
      parameters:
        - name: asset
          in: query
          required: true
          description: >
            Ticker of the asset to look up, e.g. `PETR4`. Must match
            `^[A-Z0-9]+$` (uppercase letters and digits only).
          schema:
            type: string
            pattern: "^[A-Z0-9]+$"
        - name: start
          in: query
          required: true
          description: Inclusive start date, `YYYY-MM-DD`.
          schema:
            type: string
            format: date
          example: "2015-01-02"
        - name: end
          in: query
          required: true
          description: Inclusive end date, `YYYY-MM-DD`. Must not be before `start`.
          schema:
            type: string
            format: date
          example: "2015-12-30"
      responses:
        "200":
          description: >
            The asset's candles in the requested range, sorted by date
            ascending. `[]` (not `null`) when the asset has no data in that
            range - there is no `404` case for this endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandlesResponse"
              example:
                - date: "2015-01-02"
                  open: 9.36
                  high: 9.5
                  low: 9.3
                  avg: 9.4
                  close: 9.45
                  quantity: 458200
                  volume: 4309490.0
                  trades: 312
        "400":
          description: >
            Missing/empty `asset`/`start`/`end` query param, `asset` doesn't
            match `^[A-Z0-9]+$`, unparseable `start`/`end`, or `end` before
            `start`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    error: "asset, start and end are all required"
                invalidAsset:
                  value:
                    error: 'asset must match ^[A-Z0-9]+$ (uppercase letters and digits only), got "../../etc"'
                invalidDate:
                  value:
                    error: "parsing start: parsing time \"not-a-date\" as \"2006-01-02\": ..."
                endBeforeStart:
                  value:
                    error: "end must not be before start"
        "500":
          description: Unexpected server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/indicators/sma:
    get:
      operationId: getIndicatorSma
      summary: >
        Raw Simple Moving Average time series for an asset over an inclusive
        date range, for charting as an overlay on `GET /api/candles`. Runs
        no strategy and returns no derived decision - just the indicator's
        values, computed by the exact same code
        (`internal/indicators.LoadIndicator("sma", ...)`) the
        `sma-crossover` strategy uses.
      parameters:
        - name: asset
          in: query
          required: true
          description: >
            Ticker of the asset to look up, e.g. `PETR4`. Must match
            `^[A-Z0-9]+$` (uppercase letters and digits only).
          schema:
            type: string
            pattern: "^[A-Z0-9]+$"
        - name: start
          in: query
          required: true
          description: Inclusive start date, `YYYY-MM-DD`.
          schema:
            type: string
            format: date
          example: "2015-01-02"
        - name: end
          in: query
          required: true
          description: Inclusive end date, `YYYY-MM-DD`. Must not be before `start`.
          schema:
            type: string
            format: date
          example: "2015-12-30"
        - name: period
          in: query
          required: true
          description: >
            Number of candles the moving average is computed over, e.g. `20`.
            Must be a positive whole number.
          schema:
            type: integer
            minimum: 1
          example: 20
      responses:
        "200":
          description: >
            The indicator's values in the requested range, sorted by date
            ascending, `[]` (not `null`) when there's no data. Only includes
            dates where the indicator has enough history to be ready - the
            warm-up prefix (the first `period - 1` candles) is simply
            omitted, never sent as `null`/`0`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorResponse"
              example:
                - date: "2015-01-30"
                  value: 32.51
                - date: "2015-02-02"
                  value: 32.64
        "400":
          description: >
            Missing/empty `asset`/`start`/`end`/`period` query param, `asset`
            doesn't match `^[A-Z0-9]+$`, unparseable `start`/`end`, `end`
            before `start`, or `period` missing/non-integer/non-positive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    error: "asset, start, end and period are all required"
                invalidAsset:
                  value:
                    error: 'asset must match ^[A-Z0-9]+$ (uppercase letters and digits only), got "../../etc"'
                invalidDate:
                  value:
                    error: "parsing start: parsing time \"not-a-date\" as \"2006-01-02\": ..."
                endBeforeStart:
                  value:
                    error: "end must not be before start"
                invalidPeriod:
                  value:
                    error: "period must be a positive integer"
        "500":
          description: Unexpected server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/indicators/ema:
    get:
      operationId: getIndicatorEma
      summary: >
        Raw Exponential Moving Average time series for an asset over an
        inclusive date range, for charting as an overlay on
        `GET /api/candles`. Identical contract to `GET /api/indicators/sma`
        above (same params, same response shape, same warm-up-prefix-omitted
        behavior) - only the underlying indicator math differs.
      parameters:
        - name: asset
          in: query
          required: true
          description: >
            Ticker of the asset to look up, e.g. `PETR4`. Must match
            `^[A-Z0-9]+$` (uppercase letters and digits only).
          schema:
            type: string
            pattern: "^[A-Z0-9]+$"
        - name: start
          in: query
          required: true
          description: Inclusive start date, `YYYY-MM-DD`.
          schema:
            type: string
            format: date
          example: "2015-01-02"
        - name: end
          in: query
          required: true
          description: Inclusive end date, `YYYY-MM-DD`. Must not be before `start`.
          schema:
            type: string
            format: date
          example: "2015-12-30"
        - name: period
          in: query
          required: true
          description: >
            Number of candles the moving average is computed over, e.g. `8`.
            Must be a positive whole number.
          schema:
            type: integer
            minimum: 1
          example: 8
      responses:
        "200":
          description: >
            The indicator's values in the requested range, sorted by date
            ascending, `[]` (not `null`) when there's no data. Only includes
            dates where the indicator has enough history to be ready - the
            warm-up prefix (the first `period - 1` candles) is simply
            omitted, never sent as `null`/`0`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorResponse"
              example:
                - date: "2015-01-13"
                  value: 32.51
                - date: "2015-01-14"
                  value: 32.64
        "400":
          description: >
            Missing/empty `asset`/`start`/`end`/`period` query param, `asset`
            doesn't match `^[A-Z0-9]+$`, unparseable `start`/`end`, `end`
            before `start`, or `period` missing/non-integer/non-positive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    error: "asset, start, end and period are all required"
                invalidAsset:
                  value:
                    error: 'asset must match ^[A-Z0-9]+$ (uppercase letters and digits only), got "../../etc"'
                invalidDate:
                  value:
                    error: "parsing start: parsing time \"not-a-date\" as \"2006-01-02\": ..."
                endBeforeStart:
                  value:
                    error: "end must not be before start"
                invalidPeriod:
                  value:
                    error: "period must be a positive integer"
        "500":
          description: Unexpected server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      description: The JSON shape every endpoint returns on failure.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
      example:
        error: human-readable message

    InfoResponse:
      type: object
      required: [asset, earliest, latest]
      properties:
        asset:
          type: string
          description: Echoes the request's `asset` query param.
          example: PETR4
        earliest:
          type: string
          format: date
          example: "2010-01-04"
        latest:
          type: string
          format: date
          example: "2026-07-30"

    AssetEntry:
      type: object
      required: [ticker]
      properties:
        ticker:
          type: string
          example: "PETR4"
        volume:
          type: number
          nullable: false
          description: >
            That year's total trading volume, in major currency units (same
            convention as a candle's `volume` field, see `Candle`). Only
            present when the request that produced this entry included a
            `year` query param; omitted entirely otherwise (volume is
            meaningless without a specific year to sum over).
          example: 45123456.78

    AssetsResponse:
      type: object
      required: [stocks, others]
      properties:
        stocks:
          type: array
          description: >
            Common equities (ordinary/preferred share classes), e.g.
            `PETR4`, `PETR3`, `VALE3`, `ITUB4`.
          items:
            $ref: "#/components/schemas/AssetEntry"
          example: [{ ticker: "ITUB4" }, { ticker: "PETR3" }, { ticker: "PETR4" }, { ticker: "VALE3" }]
        others:
          type: array
          description: >
            Everything else - units, ETFs, BDRs, index-tracking tickers,
            e.g. `IBOV11`, `BOVA11`.
          items:
            $ref: "#/components/schemas/AssetEntry"
          example: [{ ticker: "BOVA11" }, { ticker: "IBOV11" }]

    StrategyParam:
      type: object
      description: >
        One parameter a strategy's `strategyParams` accepts, for a UI to
        render an appropriately-labeled input. A hint only - see
        `BacktestRequest.strategyParams` for the authoritative per-strategy
        required-ness and cross-field rules, which are not expressible here
        and are enforced server-side by `POST /api/backtest`.
      required: [key, label, default, min, step]
      properties:
        key:
          type: string
          description: >
            The key this param is set under in `strategyParams`, e.g.
            `shortPeriod`.
          example: shortPeriod
        label:
          type: string
          description: Human-readable label for the input.
          example: Short period
        default:
          type: number
          description: Sensible prefilled value.
          example: 10
        min:
          type: number
          description: Inclusive lower bound, for the input's `min` attribute.
          example: 1
        max:
          type: number
          nullable: true
          description: >
            Inclusive upper bound, for the input's `max` attribute. Omitted
            entirely from the JSON (never `null`) when unbounded.
          example: 100
        step:
          type: number
          description: Input `step` attribute, e.g. `1` for a period.
          example: 1

    StrategyInfo:
      type: object
      description: >
        One entry in `GET /api/strategies`' response: a strategy's name plus
        what params (if any) it expects.
      required: [name, params]
      properties:
        name:
          type: string
          description: One of the names accepted by `strategy` on `POST /api/backtest`.
          example: sma-crossover
        params:
          type: array
          description: >
            `[]` (never `null`) for a strategy that takes no params, e.g.
            `buy-and-hold`.
          items:
            $ref: "#/components/schemas/StrategyParam"

    BacktestRequest:
      type: object
      required: [asset, start, end, strategy, balance]
      properties:
        asset:
          type: string
          pattern: "^[A-Z0-9]+$"
          description: >
            Ticker of the asset to backtest, e.g. `PETR4`. Must already be
            imported, and must match `^[A-Z0-9]+$` (uppercase letters and
            digits only) - enforced server-side to keep the value safe to
            use in a filesystem path lookup.
          example: PETR4
        start:
          type: string
          format: date
          description: Inclusive range start, `YYYY-MM-DD`.
          example: "2015-01-02"
        end:
          type: string
          format: date
          description: Inclusive range end, `YYYY-MM-DD`.
          example: "2015-12-30"
        strategy:
          type: string
          description: >
            One of the `name` values returned by `GET /api/strategies`, e.g.
            `buy-and-hold`.
          example: buy-and-hold
        balance:
          type: string
          description: >
            Starting cash balance as a decimal string, e.g. `"10000.00"`.
            Must be > 0. Sent as a string (not a number) to avoid float
            precision issues, same as the CLI's `-balance` flag.
          example: "10000.00"
        stopLoss:
          $ref: "#/components/schemas/StopLossRequest"
        verbose:
          type: boolean
          default: false
          description: >
            When `true`, the response includes the `operations` array.
        strategyParams:
          type: object
          nullable: true
          additionalProperties:
            type: number
          description: >
            Optional named numeric params configuring `strategy`, keyed by
            param name. Omit entirely (or send `{}`/`null`) for a strategy
            that takes none - `buy-and-hold` and `two-candle-breakout`
            both ignore it either way. Which keys are required, and what
            they mean, depends on `strategy` (not a generic schema - mirrors
            how `stopLoss.value`'s meaning is `stopLoss.type`-specific
            above), and is enforced by that strategy's own constructor, not
            by this schema:
              - `sma-crossover` / `ema-crossover`: `shortPeriod` and
                `longPeriod` - the number of candles each of the two moving
                averages (Simple/Exponential respectively) is computed
                over. Both required; `shortPeriod` must be strictly less
                than `longPeriod`. The strategy buys, while flat, on the
                candle where the short-period average crosses above the
                long-period one, and sells, while holding, on the candle
                where it crosses back below - both at that candle's closing
                price. Produces no signal until both averages have enough
                candles behind them to compute a value (`longPeriod`
                candles into the backtest's range, at minimum).
              - `rsi-threshold`: `period` (candles the RSI is computed
                over), `oversold` and `overbought` (both 0-100, `oversold`
                strictly less than `overbought`). All three required. Buys,
                while flat, on the candle where RSI crosses below
                `oversold`; sells, while holding, on the candle where RSI
                crosses above `overbought` - both at that candle's closing
                price. Produces no signal until RSI has `period`+1 candles
                behind it.
              - `ema-trend-breakout`: `shortPeriod` and `longPeriod`, same
                keys/rule as `sma-crossover`/`ema-crossover` (both required,
                `shortPeriod` strictly less than `longPeriod`). It's
                `two-candle-breakout`'s buy/sell trigger (buys, while flat,
                at the min of the previous two candles' lows once the
                current candle's low reaches it; sells, while holding, at
                the max of the previous two candles' highs once the current
                candle's high reaches it), with one extra condition ANDed
                onto the buy side only: both EMAs must be ready, the short
                EMA must be above the long EMA (uptrend), and the current
                candle's close must be above the short EMA. The sell side is
                unaffected by the EMAs.
          example: { shortPeriod: 5, longPeriod: 20 }

    ScanRequest:
      type: object
      required: [start, end, strategy, balance]
      description: >
        Same request as `BacktestRequest`, minus `asset` (a scan runs every
        available asset, not one - see `year` below) and `verbose` (a scan's
        response never includes per-operation detail, see `ScanResult`).
      properties:
        start:
          type: string
          format: date
          description: Same as `BacktestRequest.start`.
          example: "2015-01-01"
        end:
          type: string
          format: date
          description: Same as `BacktestRequest.end`.
          example: "2015-12-30"
        strategy:
          type: string
          description: >
            Same as `BacktestRequest.strategy` - the "challenger" strategy
            run against each asset's Buy & Hold baseline. One of the `name`
            values returned by `GET /api/strategies`.
          example: sma-crossover
        balance:
          type: string
          description: Same as `BacktestRequest.balance`.
          example: "10000.00"
        stopLoss:
          $ref: "#/components/schemas/StopLossRequest"
        strategyParams:
          type: object
          nullable: true
          additionalProperties:
            type: number
          description: >
            Same meaning as `BacktestRequest.strategyParams` - see that
            field for the full per-strategy required-key documentation.
          example: { shortPeriod: 10, longPeriod: 30 }
        year:
          type: integer
          description: >
            Optional. Same filter as `GET /api/assets`' `year` query param:
            when present (non-zero), only tickers with imported data for
            this year are scanned. Omit (or send `0`) to scan every
            imported asset.
          example: 2015

    StopLossRequest:
      type: object
      nullable: true
      description: >
        Optional risk control raced against the strategy's own exit signal:
        once a position is open, whichever fires first on a candle - the
        strategy's own signal, or the stop-loss's - closes the position,
        with the stop-loss winning on a same-candle tie. Omit `stopLoss`
        entirely for no stop-loss (the default) - this is unchanged
        existing behavior, not a new requirement. Alternatively, set
        `type: none` for the same effect as an explicit, selectable type
        (e.g. useful for a frontend that always sends a `stopLoss` object).
      required: [type, value]
      properties:
        type:
          type: string
          description: >
            One of the names returned by `GET /api/stop-losses`.
          example: percent
        value:
          type: number
          description: >
            Meaning depends on `type`:
              - `percent`: a percentage below the entry price, e.g. `5` for
                5%. Must be > 0 and < 100 (>= 100 would produce a
                zero/negative trigger price that could never fire, since a
                candle's low can never be negative).
              - `fixed-amount`: a currency amount below the entry price, PER
                SHARE, in BRL major units, e.g. `2.5` for R$2.50 below the
                per-share entry price. Must be > 0. This is NOT a cap on the
                total position's currency loss - the realized loss on the
                whole position when this stop-loss fires is approximately
                `value * quantity`, where quantity is however many shares the
                backtest's position sizing bought. E.g. a 1000-share position
                with `value: 2.5` can lose roughly R$2500 when the stop-loss
                triggers, not R$2.50. To target a specific total loss, divide
                it by the expected share quantity before sending it as
                `value`.
              - `total-fixed-amount`: a currency amount, in BRL major units,
                that caps the position's TOTAL realized loss regardless of
                how many shares it holds, e.g. `value: 500` for a maximum
                R$500 loss on the whole position - contrast with
                `fixed-amount` above, which is per share and has no such
                cap. Must be > 0. Internally this divides `value` by the
                position's quantity to derive a per-share trigger, floored
                to the nearest cent, so the realized total loss when it
                fires is `<= value`, short by at most a fraction of a cent
                per share.
              - `none`: unused - there's no trigger to configure. Must be
                `0` (or omitted, which is the same as `0`).
          example: 5

    Order:
      type: object
      description: >
        A buy or sell order. There is no separate order-type field: the
        containing key (`buyOrder` vs `sellOrder`) already says which it is.
      required: [date, price, quantity]
      properties:
        date:
          type: string
          format: date
          example: "2015-01-02"
        price:
          type: number
          description: Plain JSON number in BRL major units.
          example: 9.36
        quantity:
          type: integer
          example: 1068

    Operation:
      type: object
      required: [date, buyOrder, sellOrder, days]
      properties:
        date:
          type: string
          format: date
          example: "2015-01-02"
        buyOrder:
          $ref: "#/components/schemas/Order"
        sellOrder:
          $ref: "#/components/schemas/Order"
        days:
          type: integer
          description: >
            Whole calendar days between the buy and sell dates
            (`sellOrder.date - buyOrder.date`). `0` when both fall on the
            same day.
          example: 362

    Candle:
      type: object
      required:
        - date
        - open
        - high
        - low
        - avg
        - close
        - quantity
        - volume
        - trades
      properties:
        date:
          type: string
          format: date
          example: "2015-01-02"
        open:
          type: number
          description: Plain JSON number in BRL major units.
          example: 9.36
        high:
          type: number
          description: Plain JSON number in BRL major units.
          example: 9.5
        low:
          type: number
          description: Plain JSON number in BRL major units.
          example: 9.3
        avg:
          type: number
          description: Volume-weighted average price, plain JSON number in BRL major units.
          example: 9.4
        close:
          type: number
          description: Plain JSON number in BRL major units.
          example: 9.45
        quantity:
          type: integer
          description: Total shares traded that day.
          example: 458200
        volume:
          type: number
          description: Total financial volume traded that day, in BRL major units.
          example: 4309490.0
        trades:
          type: integer
          description: Number of trades that day.
          example: 312

    CandlesResponse:
      type: array
      items:
        $ref: "#/components/schemas/Candle"

    IndicatorPoint:
      type: object
      description: >
        One point in the array returned by `GET /api/indicators/sma` /
        `GET /api/indicators/ema`. Which indicator/period it's for is not
        repeated here - the caller already knows, since it picked the URL
        and the `period` query param.
      required: [date, value]
      properties:
        date:
          type: string
          format: date
          example: "2015-01-30"
        value:
          type: number
          example: 32.51

    IndicatorResponse:
      type: array
      items:
        $ref: "#/components/schemas/IndicatorPoint"

    BacktestResult:
      type: object
      required:
        - strategyName
        - startingBalance
        - endingBalance
        - profit
        - profitPercentage
        - totalOperations
        - gains
        - losses
        - winRate
        - maxDrawdownPercentage
        - maxDrawdownAmount
      properties:
        strategyName:
          type: string
          description: >
            Display name of the strategy that ran (may differ from the
            request's `strategy` slug, e.g. `"buy-and-hold"` ->
            `"Buy & Hold"`).
          example: Buy & Hold
        startingBalance:
          type: number
          description: Same as the request's `balance`, parsed.
          example: 10000
        endingBalance:
          type: number
          description: Balance after all operations.
          example: 7223.2
        profit:
          type: number
          description: "`endingBalance - startingBalance`."
          example: -2776.8
        profitPercentage:
          type: number
          description: >
            `profit` relative to `startingBalance`, e.g. `12.5` for +12.5%.
          example: -27.768000000000004
        totalOperations:
          type: integer
          description: >
            Total number of operations the strategy produced (`gains +
            losses`). Exposed as its own field so callers can see it without
            summing `gains`/`losses`, and without needing `verbose: true`
            (which is required to see the `operations` array itself).
          example: 1
        gains:
          type: integer
          description: >
            Count of operations that closed at a profit (break-even counts
            as a gain).
          example: 0
        losses:
          type: integer
          description: Count of operations that closed at a loss.
          example: 1
        winRate:
          type: number
          description: >
            `gains / total operations * 100`. `0` if there were no
            operations.
          example: 0
        maxDrawdownPercentage:
          type: number
          description: >
            Largest peak-to-trough decline in balance across the operations,
            as a percentage of the peak (e.g. `15.23` for a 15.23%
            drawdown). `0` if the balance never declined below a prior peak
            (including when there are no operations).
          example: 27.768000000000004
        maxDrawdownAmount:
          type: number
          description: >
            Largest peak-to-trough decline in balance across the operations,
            in absolute currency terms (always non-negative), e.g. `2776.80`.
            `0` under the same conditions as `maxDrawdownPercentage`.
          example: 2776.8
        operations:
          type: array
          description: >
            **Omitted entirely when `verbose` is `false`/absent** in the
            request (not present in the JSON at all, not `null` or `[]`).
          items:
            $ref: "#/components/schemas/Operation"

    ScanResult:
      type: object
      description: >
        One asset's outcome from `POST /api/scan`. Two mutually-exclusive
        shapes, distinguished by whether `error` is present:
          - Success: `asset` plus `baselineProfitPercentage`,
            `challengerProfitPercentage`, `challengerTotalOperations`,
            `delta` and `won` are all present; `error` is omitted.
          - Failure (that asset's backtest failed to load/run, e.g. corrupt
            imported data): only `asset` and `error` are present - every
            numeric/boolean field above is omitted entirely (not sent as
            `0`/`false`), so the two shapes are never confusable.
      required: [asset]
      properties:
        asset:
          type: string
          example: PETR4
        baselineProfitPercentage:
          type: number
          description: >
            The Buy & Hold baseline's `profitPercentage` for this asset,
            same meaning as `BacktestResult.profitPercentage`. Omitted on a
            failed entry.
          example: -27.77
        challengerProfitPercentage:
          type: number
          description: >
            The requested `strategy`'s `profitPercentage` for this asset.
            Omitted on a failed entry.
          example: 12.34
        challengerTotalOperations:
          type: integer
          description: >
            The requested `strategy`'s `totalOperations` for this asset -
            included specifically so a "win" that's really just "the
            strategy never traded and the baseline happened to lose money"
            is visibly distinguishable from a win earned by actually
            trading. Omitted on a failed entry.
          example: 6
        delta:
          type: number
          description: >
            `challengerProfitPercentage - baselineProfitPercentage`, in
            percentage points. Omitted on a failed entry.
          example: 40.11
        won:
          type: boolean
          description: >
            `delta > 0`, strictly - an exact tie is not a win. Omitted on a
            failed entry.
          example: true
        error:
          type: string
          description: >
            Present only on a failed entry - why this asset's backtest
            couldn't be run (e.g. a candle-loading failure). Every other
            field above is omitted when this is present.
          example: "loading candles for XPTO3: ..."
